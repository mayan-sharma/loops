[workspace]
members = ["crates/loops-core", "crates/loops-tui"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"

# Shared dependency versions. Crates opt in with `name.workspace = true`.
[workspace.dependencies]
loops-core = { path = "crates/loops-core" }

anyhow = "1.0.104"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.34"
# `unstable-rendered-line-info` gives `Paragraph::line_count`, used to keep the
# transcript scrolled to the bottom after wrapping.
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
# Successor of `tui-textarea` (0.7 is pinned to ratatui 0.29 / crossterm 0.28).
ratatui-textarea = "0.9.4"
# `io-util` reads a `bash` child's output in chunks; it only adds `bytes`, which `process` already pulls in.
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs", "io-util"] }

# Default features off: they pull in rustls + aws-lc-rs (a C build) and system-proxy
# lookup, neither needed to talk to LM Studio on localhost. Re-add TLS for cloud APIs.
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
